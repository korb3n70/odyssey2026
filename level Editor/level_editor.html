<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Odyssey 2026 - Map Editor</title>
    <style>
        body {
            background-color: #1e1e1e; color: #00ff00;
            font-family: 'Courier New', Courier, monospace;
            margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center;
        }
        h1 { margin-bottom: 5px; color: #00ffcc; text-shadow: 0 0 5px #00ffcc; }
        .toolbar {
            background-color: #2a2a2a; padding: 15px; border-radius: 8px;
            border: 1px solid #444; margin-bottom: 20px; display: flex; gap: 20px;
            flex-wrap: wrap;
        }
        .tool-group { display: flex; flex-direction: column; align-items: center; }
        label { font-size: 14px; margin-bottom: 5px; color: #aaa; }
        input[type="number"] {
            width: 60px; background: #000; color: #0f0; border: 1px solid #555; padding: 5px; font-family: inherit;
        }
        button {
            background-color: #444; color: #fff; border: 1px solid #777;
            padding: 8px 15px; cursor: pointer; font-family: inherit; font-weight: bold; border-radius: 4px;
        }
        button:hover { background-color: #666; color: #0f0; }
        .export-btn { background-color: #008800; color: #fff; }
        .export-btn:hover { background-color: #00aa00; color: #fff; }
        .import-btn { background-color: #004488; color: #fff; }
        .import-btn:hover { background-color: #0066cc; color: #fff; }
        
        .palette { display: flex; gap: 10px; }
        .color-btn {
            width: 30px; height: 30px; border: 2px solid #222; cursor: pointer; border-radius: 4px;
        }
        .color-btn.selected { border-color: #fff; transform: scale(1.1); box-shadow: 0 0 10px #fff; }
        
        #grid {
            display: grid; border: 2px solid #555; background-color: #000; user-select: none;
            margin-bottom: 20px;
        }
        .cell {
            width: 20px; height: 10px; border-right: 1px solid #222; border-bottom: 1px solid #222; box-sizing: border-box;
        }
        .cell:hover { opacity: 0.8; outline: 1px solid #fff; z-index: 10; }
        
        .io-section {
            display: flex; gap: 20px; margin-top: 20px; flex-wrap: wrap;
        }
        
        .io-container {
            display: flex; flex-direction: column;
        }
        
        .io-label {
            color: #00ffcc; font-weight: bold; margin-bottom: 5px; font-size: 12px;
        }
        
        textarea {
            width: 300px; height: 200px; background: #000; color: #0f0;
            border: 1px solid #555; padding: 10px; font-family: inherit; resize: vertical;
            font-size: 11px;
        }
        
        #output {
            border-color: #00aa00;
        }
        
        #import-input {
            border-color: #0066cc;
        }
        
        .message {
            color: #ff6600; margin-top: 10px; font-size: 12px; min-height: 20px;
        }
        
        .message.success {
            color: #00ff00;
        }
        
        .message.error {
            color: #ff4444;
        }
    </style>
</head>
<body>

    <h1>ODYSSEY 2026 - RLE MAP EDITOR</h1>
    <p>Disegna la mappa. Tieni premuto il mouse per colorare velocemente.</p>

    <div class="toolbar">
        <div class="tool-group">
            <label>Larghezza (X)</label>
            <input type="number" id="width" value="24" min="1" max="40">
        </div>
        <div class="tool-group">
            <label>Altezza (Y)</label>
            <input type="number" id="height" value="12" min="1" max="25">
        </div>
        <div class="tool-group" style="justify-content: flex-end;">
            <button onclick="generateGrid()">Applica / Azzera Mappa</button>
        </div>
        <div class="tool-group" style="border-left: 1px solid #444; padding-left: 20px;">
            <label>Seleziona Mattoncino</label>
            <div class="palette" id="palette">
                </div>
        </div>
    </div>

    <div id="grid"></div>

    <div class="io-section">
        <div class="io-container">
            <div class="io-label">📤 ESPORTA RLE</div>
            <textarea id="output" readonly placeholder="Il codice Assembly RLE apparirà qui..."></textarea>
            <button class="export-btn" onclick="exportASM()" style="margin-top: 10px;">ESPORTA COMPRESSO</button>
        </div>
        
        <div class="io-container">
            <div class="io-label">📥 IMPORTA RLE</div>
            <textarea id="import-input" placeholder="Incolla qui il codice Assembly esportato..."></textarea>
            <button class="import-btn" onclick="importASM()" style="margin-top: 10px;">IMPORTA LIVELLO</button>
            <div id="import-message" class="message"></div>
        </div>
    </div>

    <script>
        // Palette C64 Breakout
        const colors = {
            0:  { hex: '#000000', name: 'Vuoto' },
            2:  { hex: '#880000', name: 'Rosso (1 hit)' },
            8:  { hex: '#dd8855', name: 'Arancio (1 hit)' },
            7:  { hex: '#eeee77', name: 'Giallo (1 hit)' },
            5:  { hex: '#00cc55', name: 'Verde (1 hit)' },
            15: { hex: '#bbbbbb', name: 'Grigio (2 hit)' },
            6:  { hex: '#0000aa', name: 'Blu (Muro)' }
        };

        let currentColor = 2; // Default rosso
        let mapData = [];

        function initPalette() {
            const pal = document.getElementById('palette');
            for (const [code, info] of Object.entries(colors)) {
                const btn = document.createElement('div');
                btn.className = 'color-btn' + (code == currentColor ? ' selected' : '');
                btn.style.backgroundColor = info.hex;
                btn.title = info.name;
                btn.onclick = () => {
                    document.querySelectorAll('.color-btn').forEach(b => b.classList.remove('selected'));
                    btn.classList.add('selected');
                    currentColor = parseInt(code);
                };
                pal.appendChild(btn);
            }
        }

        function generateGrid() {
            const w = parseInt(document.getElementById('width').value);
            const h = parseInt(document.getElementById('height').value);
            const grid = document.getElementById('grid');
            
            grid.style.gridTemplateColumns = `repeat(${w}, 20px)`;
            grid.innerHTML = '';
            mapData = new Array(w * h).fill(0);

            for (let i = 0; i < w * h; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.dataset.index = i;
                
                // Disegno con click o trascinamento
                cell.onmousedown = (e) => paintCell(e, i);
                cell.onmouseover = (e) => { if (e.buttons === 1) paintCell(e, i); };
                
                grid.appendChild(cell);
            }
            document.getElementById('output').value = '';
            document.getElementById('import-message').textContent = '';
        }

        function paintCell(e, index) {
            mapData[index] = currentColor;
            e.target.style.backgroundColor = colors[currentColor].hex;
        }

        // --- MAGIA DELLA COMPRESSIONE RLE ---
        function exportASM() {
            let bytes = [];
            let curColor = mapData[0];
            let count = 0;

            // RLE Encoder (Nibble Alto = Conteggio, Nibble Basso = Colore)
            for (let i = 0; i < mapData.length; i++) {
                if (mapData[i] === curColor && count < 16) {
                    count++;
                } else {
                    // Salva il byte: (Conteggio - 1) * 16 + Colore
                    bytes.push(((count - 1) << 4) | curColor);
                    curColor = mapData[i];
                    count = 1;
                }
            }
            if (count > 0) {
                bytes.push(((count - 1) << 4) | curColor);
            }

            // Generazione Testo ASM
            const w = document.getElementById('width').value;
            const h = document.getElementById('height').value;
            const uncompressedSize = w * h;
            
            let asm = `; --- MAPPA ODYSSEY ESPORTATA ---\n`;
            asm += `; Dimensioni originali: ${w}x${h} (${uncompressedSize} bytes)\n`;
            asm += `; Compressa con RLE a: ${bytes.length} bytes!\n`;
            asm += `; Formato: Nibble Alto = Count-1, Nibble Basso = Colore\n`;
            asm += `LEVEL_DATA:\n`;

            for (let i = 0; i < bytes.length; i += 12) {
                let chunk = bytes.slice(i, i + 12).map(b => '$' + b.toString(16).padStart(2, '0').toUpperCase());
                asm += `    !byte ${chunk.join(",")}\n`;
            }

            document.getElementById('output').value = asm;
        }

        // --- DECODIFICA RLE ---
        function importASM() {
            const input = document.getElementById('import-input').value;
            const msgDiv = document.getElementById('import-message');
            
            try {
                // Estrae tutti i byte hexadecimali dal testo (formato: $XX)
                const hexMatches = input.match(/\$([0-9A-Fa-f]{2})/g);
                
                if (!hexMatches || hexMatches.length === 0) {
                    throw new Error('Nessun byte trovato. Assicurati di incollare il codice !byte correttamente.');
                }

                // Converte in array di numeri
                const bytes = hexMatches.map(h => parseInt(h.substring(1), 16));
                
                // Decodifica RLE: Nibble Alto = Count-1, Nibble Basso = Colore
                let decodedData = [];
                for (const byte of bytes) {
                    const count = ((byte >> 4) & 0xF) + 1;  // Nibble alto + 1
                    const color = byte & 0xF;                // Nibble basso
                    for (let i = 0; i < count; i++) {
                        decodedData.push(color);
                    }
                }

                // Calcola dimensioni (assumendo larghezza standard, altrimenti cerca nei commenti)
                let width = 24;
                let height = 12;
                
                // Prova a estrarre dimensioni dai commenti
                const dimensionMatch = input.match(/(\d+)x(\d+)/);
                if (dimensionMatch) {
                    width = parseInt(dimensionMatch[1]);
                    height = parseInt(dimensionMatch[2]);
                }
                
                // Verifica che i dati coincidano
                const expectedSize = width * height;
                if (decodedData.length !== expectedSize) {
                    // Prova a calcolare width/height
                    width = Math.ceil(Math.sqrt(decodedData.length));
                    height = Math.ceil(decodedData.length / width);
                }

                // Aggiorna i controlli della griglia
                document.getElementById('width').value = width;
                document.getElementById('height').value = height;
                
                // Genera la griglia
                mapData = decodedData;
                const grid = document.getElementById('grid');
                grid.style.gridTemplateColumns = `repeat(${width}, 20px)`;
                grid.innerHTML = '';

                const cells = document.querySelectorAll('#grid .cell');
                for (let i = 0; i < mapData.length; i++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.dataset.index = i;
                    cell.style.backgroundColor = colors[mapData[i]].hex;
                    
                    cell.onmousedown = (e) => paintCell(e, i);
                    cell.onmouseover = (e) => { if (e.buttons === 1) paintCell(e, i); };
                    
                    grid.appendChild(cell);
                }

                msgDiv.className = 'message success';
                msgDiv.textContent = `✓ Importato: ${width}x${height} (${decodedData.length} celle, ${bytes.length} bytes RLE)`;
                
            } catch (error) {
                msgDiv.className = 'message error';
                msgDiv.textContent = `✗ Errore: ${error.message}`;
                console.error('Import error:', error);
            }
        }

        // Inizializzazione
        initPalette();
        generateGrid();
    </script>
</body>
</html>
